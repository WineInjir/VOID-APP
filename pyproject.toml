[project]
name = "void-vpn"
version = "0.1.0"
description = "Cross-platform proxy client for sing-box extended"
requires-python = "==3.14"
dependencies = [
    "kivy>=2.3.0",
    "kivymd==1.2.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
android = [
    "pyjnius>=1.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
